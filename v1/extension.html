<!DOCTYPE html>
<html>
<head>
  <title>LeetCode Helper</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }
    
    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #262626;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    
    .stats {
      margin-bottom: 15px;
    }
    
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .stat-label {
      font-weight: 500;
      color: #555;
    }
    
    .stat-value {
      font-weight: 600;
      color: #0066cc;
    }
    
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .toggle-label {
      font-size: 14px;
    }
    
    .toggle {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #2196F3;
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
    
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-top: 10px;
    }
    
    button:hover {
      background-color: #0055aa;
    }
  </style>
</head>
<body>
  <h1>LeetCode Helper</h1>
  
  <div class="stats">
    <div class="stat-row">
      <span class="stat-label">Interactions tracked:</span>
      <span class="stat-value" id="interactions-count">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Actions predicted:</span>
      <span class="stat-value" id="predictions-count">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Time saved:</span>
      <span class="stat-value" id="time-saved">0 mins</span>
    </div>
  </div>
  
  <div class="settings">
    <div class="toggle-row">
      <span class="toggle-label">Tab suggestions</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-suggestions" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-row">
        <span class="toggle-label">Command autocomplete</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-autocomplete" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="toggle-row">
        <span class="toggle-label">Automation suggestions</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-automation" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="toggle-row">
        <span class="toggle-label">Contest reminders</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-contests" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <button id="clear-data">Clear Collected Data</button>
    
    <div class="footer">
      LeetCode Helper v1.0 | Adaptive ML Predictions
    </div>
    
    <script src="popup.js"></script>
  </body>
  </html>
